# 爬虫配置
scraper:
  request_delay_min: 2
  request_delay_max: 5
  max_retries: 3
  timeout: 30
  user_agent_rotation: true
  boss_max_pages: 3       # BOSS直聘最多翻几页
  max_jobs_per_source: 50  # 每个数据源最多保留多少条

# 流水线配置
pipeline:
  freshness_days: 30        # 超过此天数的岗位自动标记过期
  dedup_threshold: 0.85    # 去重相似度阈值
  min_match_score: 40       # 最低匹配分 (低于此分不收录；2026-07-30 扩覆盖降至40，让真实但 borderline 的岗位也进入供用户自筛)

