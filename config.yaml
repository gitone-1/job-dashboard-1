# 目标城市 (苏州、杭州及苏杭之间)
# 注意：上海已于 2026-07-30 按用户要求从需求中永久移除，后续更新不再采集/展示上海岗位
cities:
  - 苏州
  - 杭州
  - 无锡
  - 嘉兴
  - 湖州
  - 常州
  - 绍兴

# BOSS直聘城市代码映射
boss_city_codes:
  苏州: 100010000
  杭州: 100020000
  上海: 100030000
  无锡: 100090000
  嘉兴: 100120000
  湖州: 100130000
  常州: 100140000
  绍兴: 100150000

# 猎聘城市代码
liepin_city_codes:
  苏州: "070"
  杭州: "080"
  上海: "020"
  无锡: "100"
  常州: "110"

# 搜索关键词 (用于在招聘网站搜索)
search_keywords:
  - 产品运营
  - 数据运营
  - 策略运营
  - 用户运营
  - 增长运营
  - 数字化运营
  - 运营数据分析

# 排除的管理岗关键词 (岗位标题含这些词的会被过滤)
exclude_title_keywords:
  - 经理
  - 主管
  - 总监
  - 专家
  - 负责人
  - 高级经理
  - 高级主管
  - head
  - lead
  - director
  - senior

